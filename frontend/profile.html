<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile — Khelza</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/profile.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body class="profile-page">

  <header class="profile-header">

    <a href="/wallet.html" class="back-button" aria-label="Back to wallet">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="header-title">
      <span>ACCOUNT</span>
      <h1>Profile</h1>
    </div>

    <button
      type="button"
      class="header-icon"
      id="settings-button"
      aria-label="Settings"
    >
      <i class="fa-solid fa-gear"></i>
    </button>

  </header>


  <main class="profile-container">

    <section class="profile-hero">

      <div class="avatar" id="avatar">
        P
      </div>

      <div class="profile-main">
        <h2 id="profile-name">Player</h2>
        <span class="player-id" id="profile-id">KZ-XXXXXX</span>
      </div>

      <span class="verified" aria-label="Verified">
        <i class="fa-solid fa-check"></i>
      </span>

    </section>


    <section class="account-card">

      <div class="section-heading">
        <div>
          <span>PERSONAL INFORMATION</span>
          <h3>Account details</h3>
        </div>
      </div>


      <div class="detail-row">

        <div class="detail-icon">
          <i class="fa-regular fa-user"></i>
        </div>

        <div class="detail-content">
          <small>Full name</small>
          <strong id="detail-name">—</strong>
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          <i class="fa-regular fa-envelope"></i>
        </div>

        <div class="detail-content">
          <small>Email address</small>
          <strong id="detail-email">—</strong>
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          <i class="fa-solid fa-mobile-screen-button"></i>
        </div>

        <div class="detail-content">
          <small>Phone number</small>
          <strong id="detail-phone">—</strong>
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          <i class="fa-solid fa-user-tag"></i>
        </div>

        <div class="detail-content">
          <small>Player name</small>
          <strong id="detail-player-name">—</strong>
        </div>

      </div>


      <div class="detail-row">

        <div class="detail-icon">
          <i class="fa-solid fa-id-card"></i>
        </div>

        <div class="detail-content">
          <small>Player ID</small>
          <strong id="detail-player-id">—</strong>
        </div>

      </div>

    </section>


    <section class="balance-card">

      <div class="balance-left">
        <span>WALLET BALANCE</span>
        <strong id="profile-balance">₹0.00</strong>
      </div>

      <a href="/wallet.html" class="balance-action">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
      </a>

    </section>


    <section class="settings-card">

      <div class="section-heading">
        <div>
          <span>ACCOUNT</span>
          <h3>Settings</h3>
        </div>
      </div>


      <button
        type="button"
        class="setting-row"
        id="security-button"
      >

        <div class="setting-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="setting-content">
          <strong>Security</strong>
          <small>Password and account security</small>
        </div>

        <i class="fa-solid fa-chevron-right arrow"></i>

      </button>


      <button
        type="button"
        class="setting-row"
        id="notifications-button"
      >

        <div class="setting-icon">
          <i class="fa-regular fa-bell"></i>
        </div>

        <div class="setting-content">
          <strong>Notifications</strong>
          <small>Manage account notifications</small>
        </div>

        <i class="fa-solid fa-chevron-right arrow"></i>

      </button>


      <button
        type="button"
        class="setting-row"
        id="support-button"
      >

        <div class="setting-icon">
          <i class="fa-regular fa-circle-question"></i>
        </div>

        <div class="setting-content">
          <strong>Help & Support</strong>
          <small>Get assistance with your account</small>
        </div>

        <i class="fa-solid fa-chevron-right arrow"></i>

      </button>

    </section>


    <section class="logout-section">

      <button
        type="button"
        class="logout-button"
        id="logout-button"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>

    </section>


    <p class="version">
      Khelza • Account Center
    </p>

  </main>


  <nav class="bottom-nav" aria-label="Main navigation">

    <a href="/" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>


    <a href="/games.html" class="nav-item">
      <i class="fa-solid fa-gamepad"></i>
      <span>Games</span>
    </a>


    <a href="/wallet.html" class="nav-item">
      <i class="fa-solid fa-wallet"></i>
      <span>Wallet</span>
    </a>


    <a href="/activity.html" class="nav-item">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>Activity</span>
    </a>


    <a href="/profile.html" class="nav-item active" aria-current="page">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </a>

  </nav>


  <div
    class="profile-toast"
    id="profile-toast"
    role="status"
    aria-live="polite"
  >

    <div class="toast-icon">
      <i class="fa-solid fa-circle-info"></i>
    </div>

    <div class="toast-content">
      <strong id="toast-title">Notice</strong>
      <span id="toast-message">Something happened.</span>
    </div>

    <button
      type="button"
      id="toast-close"
      aria-label="Close notification"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

  </div>


  <script src="/js/profile.js"></script>

</body>
</html>
