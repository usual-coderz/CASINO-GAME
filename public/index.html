<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crash - Provably Fair Betting</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">

      <a href="#/" class="logo">CRASH<span class="logo-dot">.</span></a>
      <div class="nav-links">
        <a href="#/" class="nav-link" data-route="/">Home</a>
        <a href="#/games" class="nav-link" data-route="/games">Games</a>
        <a href="#/games/crash" class="nav-link" data-route="/games/crash">Crash</a>

      <div class="balance-chip">

  <main id="app">

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
